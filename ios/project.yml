# XcodeGen: `cd ios && xcodegen` → Antifraud.xcodeproj (сам проект в Git не кладём).
name: Antifraud
options:
  bundleIdPrefix: ru.antifraud
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AntifraudKit:
    path: AntifraudKit

targets:
  Antifraud:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AntifraudKit
        product: AntifraudUI
    settings:
      base:
        PRODUCT_NAME: Antifraud
        PRODUCT_BUNDLE_IDENTIFIER: ru.antifraud.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Подпись автоматическая; команду (Team) выбирают в Xcode: Signing & Capabilities.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Antifraud:
    build:
      targets:
        Antifraud: all
    run:
      config: Debug
    archive:
      config: Release
